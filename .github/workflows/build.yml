name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub ubuntu runner already has the Android SDK (ANDROID_HOME) installed.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: PC brain data matches the Android brain
        run: python3 tools/gen_brain_data.py && git diff --ignore-all-space --exit-code pc/lib/BrainData.ahk

      - name: Test Smart Brain
        run: gradle testDebugUnitTest -i | grep -E "BRAIN|FAILED|Tests? " || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HyperBot-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HyperBot-apk
          path: HyperBot-build-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hyper-Bot build ${{ github.run_number }}
          files: HyperBot-build-*.apk

  pc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Get AutoHotkey v2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # official AutoHotkey releases on GitHub (latest stable v2)
          gh release download --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_2*.zip" --output ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          Get-ChildItem ahk | Select-Object Name

      - name: Brain tests (Windows)
        shell: cmd
        run: |
          ahk\AutoHotkey64.exe /ErrorStdOut pc\tests\test_brain.ahk > test.txt 2>&1
          type test.txt
          findstr /C:"ALL TESTS PASSED" test.txt

      - name: Self-test HyperBot.ahk (loads everything, builds the window, exits)
        shell: cmd
        run: |
          ahk\AutoHotkey64.exe /ErrorStdOut pc\HyperBot.ahk --selftest > self.txt 2>&1
          type self.txt
          findstr /C:"SELFTEST OK" self.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the fruit fly brain data (FlyWire 783 connectome)
        shell: pwsh
        run: |
          python -m pip install --quiet numpy scipy pandas pyarrow
          git clone --depth 1 https://github.com/philshiu/Drosophila_brain_model fly_src
          git clone --depth 1 https://github.com/flyconnectome/flywire_annotations fly_ann
          python tools/build_fly_data.py fly_src fly_ann/supplemental_files/Supplemental_file1_neuron_annotations.tsv pc/fly/fly_data.npz
          Copy-Item fly_src/LICENSE pc/fly/MODEL_LICENSE_Shiu_et_al.txt

      - name: Portable Python for the fly brain (embeddable 3.12 + numpy)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip -OutFile py.zip
          Expand-Archive py.zip -DestinationPath pc/fly/python
          python -m pip install --quiet numpy --target pc/fly/python/Lib/site-packages
          Add-Content pc/fly/python/python312._pth "Lib\site-packages"
          pc/fly/python/python.exe pc/fly/fly_server.py --selftest

      - name: llama.cpp for AI local (Windows CPU build, official release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest release that actually has the Windows CPU build (the newest "nightly" tag can be empty)
          $url = gh api "repos/ggml-org/llama.cpp/releases?per_page=20" --jq '[.[].assets[] | select(.name | test("bin-win-cpu-x64\\.zip$"))][0].browser_download_url'
          Write-Host "llama.cpp: $url"
          if (!$url) { exit 1 }
          Invoke-WebRequest $url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath pc/ai/llama
          Get-ChildItem pc/ai/llama -Recurse -Filter llama-server.exe | Select-Object FullName

      - name: Package
        shell: pwsh
        run: |
          $d = "dist/HyperBot-PC"
          New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item pc/* $d -Recurse
          Remove-Item "$d/tests" -Recurse
          Copy-Item ahk/AutoHotkey64.exe $d
          $lic = Get-ChildItem ahk -Recurse -Filter "license*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$d/AutoHotkey_license.txt" }
          Compress-Archive -Path $d -DestinationPath "HyperBot-PC-${{ github.run_number }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-build-${{ github.run_number }}
          name: Hyper-Bot PC build ${{ github.run_number }}
          files: HyperBot-PC-*.zip

      - name: AI local test with the real model (Gemma 4 E2B, not packaged - users download it once)
        shell: cmd
        run: |
          mkdir pc\ai\models
          curl.exe -L --fail -s -o pc\ai\models\gemma-4-E2B-it-Q4_0.gguf https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf
          curl.exe -L --fail -s -o pc\ai\models\mmproj-gemma-4-E2B-it-Q8_0.gguf https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/mmproj-gemma-4-E2B-it-Q8_0.gguf
          dir pc\ai\models
          ahk\AutoHotkey64.exe /ErrorStdOut pc\tests\test_ai.ahk > ai.txt 2>&1
          type ai.txt
          findstr /C:"AI TEST OK" ai.txt
